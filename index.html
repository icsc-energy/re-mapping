        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var abstract = new L.Control({'position':'topleft'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'leaflet-control abstractUncollapsed');
            this._div.id = 'abstract';
            this._div.setAttribute("onmouseenter", "abstract.show()");
            this._div.setAttribute("onmouseleave", "abstract.hide()");
            this.show();
            return this._div;
        };
        abstract.hide = function () {
            this._div.classList.remove("abstractUncollapsed");
            this._div.classList.add("abstract");
            this._div.innerHTML = 'i';
        };
        abstract.show = function () {
            this._div.classList.remove("abstract");
            this._div.classList.add("abstractUncollapsed");
            this._div.innerHTML = 'The Analytic Hierarchy Process and Technique for Order Preference by Similarity to Ideal Solution (AHP-TOPSIS) were used to identify potential renewable energy development zones with the following criteria: annual global horizontal irradiance (kWh/sqm/year) for solar, wind speed (m/s) and wind power density (W/sqm) for wind, biomass resource potential (MJ/ha) of coco husk and shell for biomass, along with slope, aspect, land cover, and distance to urban areas, transmission lines, roads, and substations. <br /><br />Areas with no suitability classification fall under constraints, which include protected areas, indigenous areas, key biodiversity areas, cultural heritage sites, water bodies, existing renewable energy power plants, very highly susceptible areas to rain-induced landslides, and active faults.<br /><br />Suitability criteria were given importance weights based on the consolidated AHP pairwise comparisons of renewable energy experts: eight (8) for solar and wind, and five (5) for biomass. TOPSIS uses these weights to calculate the relative closeness of an area to an ideal (maximum benefits, minimum costs) and non-ideal (minimum benefits, maximum costs) solution. Results are classified to five tiers through natural breaks (Jenks).<br />';
        };
